<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <link
        rel="preload"
        as="image"
        href="./images/bg.jpeg"
    >

    <script src="./js/store.js"></script>
    <script
        src="./components/header.js"
        defer
    ></script>

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #000;
            font-family: "Pretendard Variable", sans-serif;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <main class="
        relative
        mx-auto
        h-[874px]
        w-[402px]
        overflow-hidden

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-linear-180
            from-[#000000]/80 from-30%
            to-[#000000]/65 to-100%
        "></div>

        <div class="
            absolute
            left-[env(safe-area-inset-left)]
            right-[env(safe-area-inset-right)]
            top-[env(safe-area-inset-top)]
            bottom-[env(safe-area-inset-bottom)]

            flex
            flex-col
        ">

            <div id="header-area"></div>

            <section class="
                px-[30px]
                pt-[30px]
            ">

                <div
                    id="room-name"
                    class="
                        text-[30px]
                        leading-none
                        font-bold
                    "
                >
                    방 정보를 불러오지 못했습니다.
                </div>

                <div
                    id="room-time"
                    class="
                        mt-[34px]

                        text-[27px]
                        leading-none
                        font-normal
                        whitespace-nowrap
                    "
                >
                    시간을 불러오지 못했습니다.
                </div>

            </section>

            <div
                id="participant-list"
                class="
                    mt-[48px]
                    px-[20px]

                    flex
                    flex-col
                    gap-[10px]
                "
            ></div>

            <div class="
                mt-auto

                px-[20px]
                pb-[12px]

                flex
                flex-col
                gap-[12px]
            ">

                <button
                    onclick="location.href='./sample_start.html'"
                    class="
                        h-[48px]
                        w-full
                        rounded-[20px]

                        bg-[#05D082]
                        text-white

                        text-[20px]
                        leading-none
                        font-extrabold
                    "
                >
                    준비하기
                </button>

                <button class="
                        h-[48px]
                        w-full
                        rounded-[20px]
                        
                        bg-[#DC4778]
                        text-white

                        text-[20px]
                        leading-none
                        font-extrabold
                    ">
                    나가기
                </button>

            </div>

        </div>

    </main>

    <script>
        document.getElementById("room-name").textContent = roomData.roomName;
        document.getElementById("room-time").textContent = roomData.time;

        const participantList = document.getElementById("participant-list");

        roomData.members.forEach(member => {
            const participant = document.createElement("div");

            const statusText = member.isHost
                ? "방장"
                : member.isReady
                    ? "준비완료"
                    : "준비중";

            const statusColor = member.isHost
                ? "text-[#ffffff]"
                : member.isReady
                    ? "text-[#05D082]"
                    : "text-[#DC4778]";

            participant.className = `
                h-[60px]
                rounded-[12px]

                bg-[#666666]/75

                px-[30px]

                flex
                items-center
                justify-between
            `;

            participant.innerHTML = `
                <span class="
                    text-[24px]
                    leading-none
                    font-normal
                ">
                    ${member.name}
                </span>

                <span class="
                    text-[21px]
                    leading-none
                    font-bold
                    ${statusColor}
                ">
                    ${statusText}
                </span>
            `;

            participantList.appendChild(participant);
        });

        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });
    </script>

</body>

</html>
