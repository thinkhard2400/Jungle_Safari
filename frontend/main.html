<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <link
        rel="preload"
        as="image"
        href="./images/bg.jpeg"
    >

    <script src="./js/store.js"></script>
    <script
        src="./components/header.js"
        defer
    ></script>

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;

            background: #000;

            font-family: "Pretendard Variable", sans-serif;

            overflow: hidden;
        }
    </style>
</head>

<body>

    <main class="
        relative
        h-dvh
        w-full
        overflow-hidden

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-linear-180
            from-[#000000]/80 from-30%
            to-[#000000]/65 to-100%
        "></div>


        <div class="
            absolute
            left-[env(safe-area-inset-left)]
            right-[env(safe-area-inset-right)]
            top-[env(safe-area-inset-top)]
            bottom-[env(safe-area-inset-bottom)]

            flex
            flex-col
        ">

            <div id="header-area"></div>

            <div
                id="room-list"
                class="
                    mx-[12px]
                    pt-[10px]
                    mb-[10px]
                    pb-[10px]

                    flex-1
                    min-h-0
                    overflow-y-auto

                    flex
                    flex-col
                    gap-[10px]
                "
            ></div>

            <button
                onclick="location.href='./room_new.html'"
                class="
                    mx-[10px]
                    mb-[10px]

                    flex-none
                    h-[48px]
                    rounded-[20px]

                    bg-[#05D082]
                    text-white

                    text-[18px]
                    leading-none
                    font-extrabold
                    "
            >
                방 만들기
            </button>

        </div>

    </main>


    <script>
        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });

        storeReady.then(() => {

            console.log(rooms);

            const roomList = document.getElementById("room-list");

            rooms.forEach(room => {
                const card = document.createElement("a");

                card.href = "./room.html";

                card.className = `
                h-[125px]
                rounded-[10px]

                bg-[#555555]/75

                px-[32px]
                py-[20px]
            `;

                card.innerHTML = `
                <div class="
                    flex
                    items-center
                    justify-between
                ">

                    <span class="
                        w-[82px]

                        text-[24px]
                        font-bold
                    ">
                        ${room.type}
                    </span>

                    <span class="
                        text-[18px]
                        font-normal
                        whitespace-nowrap
                    ">
                        ${room.time}
                    </span>

                </div>


                <div class="
                    mt-[20px]

                    flex
                    items-center
                    justify-between
                ">

                    <span class="
                        text-[18px]
                    ">
                        ${room.name}
                    </span>

                    <span class="
                        text-[20px]
                        font-light
                    ">
                        ${room.members.length}/${room.max}
                    </span>

                </div>
            `;

                roomList.appendChild(card);
            });
        });
    </script>

</body>

</html>
