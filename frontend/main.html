<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <link
        rel="preload"
        as="image"
        href="./images/bg.jpeg"
    >

    <script src="./js/store.js"></script>

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;

            background: #000;

            font-family: "Pretendard Variable", sans-serif;

            overflow: hidden;
        }
    </style>
</head>

<body>

    <main class="
        relative
        mx-auto
        h-[874px]
        w-[402px]
        overflow-hidden

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-linear-180
            from-[#000000]/80 from-30%
            to-[#000000]/65 to-100%
        "></div>


        <div class="
            absolute
            left-[env(safe-area-inset-left)]
            right-[env(safe-area-inset-right)]
            top-[env(safe-area-inset-top)]
            bottom-[env(safe-area-inset-bottom)]

            flex
            flex-col
        ">

            {% include "components/header.html" %}

            <div
                id="room-list"
                class="
                    mx-[12px]
                    mb-[10px]
                    pb-[10px]

                    flex-1
                    min-h-0
                    overflow-y-auto

                    flex
                    flex-col
                    gap-[10px]
                "
            ></div>

            <button
                onclick="location.href='./room_new.html'"
                class="
                    mx-[10px]
                    mb-[10px]

                    flex-none
                    h-[48px]
                    rounded-[20px]

                    bg-[#05D082]
                    text-white

                    text-[18px]
                    leading-none
                    font-extrabold
                    "
            >
                방 만들기
            </button>

        </div>

    </main>


    <script>
        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });

        storeReady.then(() => {

            console.log(rooms);

            const roomList = document.getElementById("room-list");
            const sportIcons = {
                "농구": "sports_basketball.svg",
                "헬스": "sports_gym.svg",
                "런닝": "sports_run.svg",
                "축구": "sports_soccer.svg",
                "스트레칭": "sports_stretching.svg",
            };

            rooms.forEach(room => {
                const card = document.createElement("a");

                const [date, ...timeParts] = room.time.split(" ");
                const time = timeParts.join(" ");

                card.href = `./room?roomId=${encodeURIComponent(room.id)}`;

                card.className = `
                h-[125px]
                rounded-[10px]

                bg-[#555555]/75

                px-[20px]
                py-[20px]
            `;

                card.innerHTML = `
                    <div class="
                        h-full

                        flex
                        items-center
                        gap-[20px]
                    ">

                        <img
                            src="./images/${sportIcons[room.type] || sportIcons["런닝"]}"
                            alt="${room.type}"
                            class="
                                h-[42px]
                                w-[42px]
                            "
                        >
                        <div class="
                            flex-1
                            flex
                            flex-col
                        ">
                            <span class="
                                text-[20px]
                                font-normal
                            ">
                                ${date}
                            </span>
                            <span class="
                                -mt-[5px]
                                text-[20px]
                                font-semibold
                            ">
                                ${time}
                            </span>
                            <div class="
                                mt-[4px]
                                flex
                                items-center
                                justify-between
                            ">
                                <span class="
                                    text-[20px]
                                    font-normal
                                ">
                                    ${room.name}
                                </span>
                                <span class="
                                    room-count
                                    text-[18px]
                                    font-thin
                                ">
                                    ${room.members.length}/${room.max}
                                </span>

                            </div>

                        </div>

                    </div>
                `;

                card.addEventListener("click", async (event) => {
                    event.preventDefault();

                    const userId = localStorage.getItem("userId");
                    if (!userId) {
                        alert("로그인 후 방에 참가할 수 있습니다.");
                        location.href = "./login";
                        return;
                    }

                    try {
                        const response = await fetch(
                            `/api/rooms/${encodeURIComponent(room.id)}/join`,
                            {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ userId }),
                            }
                        );
                        const result = await response.json();

                        if (!response.ok) {
                            alert(result.message || "방 참가에 실패했습니다.");
                            return;
                        }

                        const count = card.querySelector(".room-count");
                        count.textContent = `${result.room.members.length}/${result.room.max}`;

                        location.href = card.href;
                    } catch (error) {
                        alert("방 참가 요청에 실패했습니다.");
                    }
                });

                roomList.appendChild(card);
            });
        });

        window.addEventListener("pageshow", (event) => {
            if (event.persisted) {
                location.reload();
            }
        });
    </script>

</body>

</html>
