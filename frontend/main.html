<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
        crossorigin
    >
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
        rel="stylesheet"
        crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >
    <link
        rel="preload"
        as="image"
        href="./images/bg.jpeg"
    >

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;

            font-family: "Pretendard Variable", sans-serif;

            overflow: hidden;
            overscroll-behavior: none;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <main class="
        relative
        h-dvh
        w-full
        overflow-hidden

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-linear-180
            from-[#000000]/90 from-30%
            to-[#000000]/75 to-100%
        "></div>

        <div class="
            absolute
            left-[env(safe-area-inset-left)]
            right-[env(safe-area-inset-right)]
            top-[env(safe-area-inset-top)]
            bottom-[env(safe-area-inset-bottom)]
        ">
            <header class="
                absolute
                top-[28px]
                left-[28px]
                right-[29px]

                flex
                items-center
                justify-between
            ">

                <div class="
                    flex
                    items-center
                    gap-[12px]
                ">
                    <img
                        src="./images/account_circle.svg"
                        alt=""
                        class="
                            h-[35px]
                            w-[35px]
                        "
                    >

                    <span class="
                        text-[20px]
                        leading-none
                        font-light
                        whitespace-nowrap
                    ">
                        <span class="font-bold "> 이상민</span>님 안녕하세요!
                    </span>
                </div>


                <button
                    type="button"
                    aria-label="메뉴 열기"
                    class="
                        border-0
                        bg-transparent
                        p-0
                    "
                >
                    <img
                        src="./images/menu.svg"
                        alt=""
                        class="
                            h-[28px]
                            w-[28px]
                        "
                    >
                </button>

            </header>

            <div
                id="room-list"
                class="
                    absolute
                    top-[84px]
                    left-[12px]
                    right-[12px]

                    flex
                    flex-col
                    gap-[10px]
                "
            ></div>

            <button
                type="button"
                class="
                    absolute
                    bottom-[10px]
                    right-[10px]
                    left-[10px]

                    h-[48px]
                    rounded-[20px]

                    bg-[#05D082]
                    text-white

                    text-[18px]
                    leading-none
                    font-extrabold

                    cursor-pointer
                    transition-transform
                    active:scale-[0.98]
                "
            >
                방 만들기
            </button>
        </div>

    </main>


    <script>
        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });

        const rooms = [
            {
                type: "런닝",
                time: "08/24 23:00 ~ 23:30",
                name: "이상민님의 방",
                current: 2,
                max: 4
            },
            {
                type: "런닝",
                time: "08/24 23:30 ~ 24:30",
                name: "아아아악",
                current: 1,
                max: 4
            }
        ];

        const roomList = document.getElementById("room-list");

        rooms.forEach(room => {
            const card = document.createElement("div");

            card.className = `
            h-[125px]
            rounded-[10px]
            bg-[#555555]/75
            px-[32px]
            py-[20px]
        `;

            card.innerHTML = `
            <div class="
                flex
                items-center
                justify-between
            ">
                <span class="
                    w-[82px]
                    shrink-0
                    text-[24px]
                    font-black
                ">
                    ${room.type}
                </span>

                <span class="
                    text-[24px]
                    font-normal
                    whitespace-nowrap
                ">
                    ${room.time}
                </span>
            </div>

            <div class="
                mt-[20px]
                flex
                items-center
                justify-between
            ">
                <span class="text-[18px]">
                    ${room.name}
                </span>

                <span class="
                    text-[20px]
                    font-light
                ">
                    ${room.current}/${room.max}
                </span>
            </div>
        `;

            roomList.appendChild(card);
        });

    </script>

</body>

</html>
