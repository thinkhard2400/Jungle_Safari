<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <link
        rel="preload"
        as="image"
        href="./images/bg.jpeg"
    >
    <link
        rel="preload"
        as="image"
        href="./images/jg_white.webp"
    >

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #000;
            font-family: "Pretendard Variable", sans-serif;
        }
    </style>
</head>

<body>

    <main class="
        relative
        mx-auto
        h-dvh
        w-full
        overflow-hidden

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-linear-180
            from-[#000000]/90 from-30%
            via-[#000000]/80 via-50%
            to-[#000000]/70 to-95%
        "></div>

        <div class="
            absolute
            top-[env(safe-area-inset-top)]
            right-[env(safe-area-inset-right)]
            bottom-[env(safe-area-inset-bottom)]
            left-[env(safe-area-inset-left)]

            grid
            grid-rows-[1fr_auto_1fr]
        ">

            <div class="
                pt-[30px]
                px-[30px]

                flex
                items-start
                justify-between
            ">

                <div class="
                    text-[32px]
                    leading-[1.2]
                    font-black
                ">
                    PROJECT<br>
                    482
                </div>

                <div class="
                    text-right
                    text-[24px]
                    leading-[1.2]
                    font-bold
                ">
                    <div>일주일에</div>
                    <div><span class="font-black">4 </span>번</div>
                    <div><span class="font-black">82 </span>분</div>
                    <div>운동하기</div>
                </div>

            </div>

            <form class="
                w-full
                px-[45px]
            ">

                <div class="
                    flex
                    h-[48px]
                    items-center
                ">

                    <label
                        for="user-id"
                        class="
                            w-[38px]

                            text-[18px]
                            leading-none
                            font-normal
                        "
                    >
                        ID
                    </label>

                    <input
                        id="user-id"
                        name="id"
                        type="text"
                        class="
                            w-0
                            h-[48px]
                            flex-1

                            rounded-[20px]
                            border-0

                            bg-white
                            px-[20px]

                            text-[18px]
                            font-medium
                            text-black
                        "
                    >

                </div>

                <div class="
                    mt-[12px]

                    flex
                    h-[48px]
                    items-center
                ">

                    <label
                        for="user-password"
                        class="
                            w-[38px]

                            text-[18px]
                            leading-none
                            font-normal
                        "
                    >
                        PW
                    </label>

                    <input
                        id="user-password"
                        name="password"
                        type="password"
                        class="
                            w-0
                            h-[48px]
                            flex-1

                            rounded-[20px]
                            border-0

                            bg-white
                            px-[20px]

                            text-[18px]
                            font-medium
                            text-black
                        "
                    >

                </div>

                <div class="
                    mt-[12px]

                    flex
                    h-[48px]
                    items-center
                ">

                    <label
                        for="user-name"
                        class="
                            w-[38px]

                            text-[18px]
                            leading-none
                            font-normal
                        "
                    >
                        이름
                    </label>

                    <input
                        id="user-name"
                        name="name"
                        type="text"
                        class="
                            w-0
                            h-[48px]
                            flex-1

                            rounded-[20px]
                            border-0

                            bg-white
                            px-[20px]

                            text-[18px]
                            font-medium
                            text-black
                        "
                    >

                </div>

                <!-- telephone -->
                <div class="
                    mt-[12px]

                    flex
                    h-[48px]
                    items-center
                ">

                    <label
                        for="phone"
                        class="
                            w-[38px]

                            text-[18px]
                            leading-none
                            font-normal
                        "
                    >
                        번호
                    </label>

                    <input
                        id="user-phone"
                        name="phone"
                        type="text"
                        pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}"
                        class="
                            w-0
                            h-[48px]
                            flex-1

                            rounded-[20px]
                            border-0

                            bg-white
                            px-[20px]

                            text-[18px]
                            font-medium
                            text-black
                        "
                    >

                </div>


                <div class="
                    mt-[52px]
                    ml-[21px]

                    flex
                    flex-col
                    gap-[12px]
                ">

                    <label class="
                        flex
                        items-center
                        gap-[10px]

                        text-[16px]
                        leading-none
                        font-normal
                    ">
                        <input
                            type="checkbox"
                            checked
                            class="
                                h-[18px]
                                w-[18px]

                                accent-white
                            "
                        >
                        <span>
                            서비스 이용약관에 동의합니다
                        </span>
                    </label>

                    <label class="
                        flex
                        items-center
                        gap-[10px]

                        text-[16px]
                        leading-none
                        font-normal
                    ">

                        <input
                            type="checkbox"
                            checked
                            class="
                                h-[18px]
                                w-[18px]

                                accent-white
                            "
                        >
                        <span>
                            개인정보 처리방침에 동의합니다
                        </span>
                    </label>
                </div>
            </form>

            <button
                type="button"
                onclick="signup()"
                class="
                        mt-[24px]
                        mx-[12px]

                        h-[48px]
                        w-[calc(100%-24px)]

                        rounded-[20px]

                        bg-[#05D082]
                        text-white

                        text-[18px]
                        leading-none
                        font-extrabold
                    "
            >
                Sign up
            </button>

            <div class="
                px-[20px]
                pb-[20px]

                flex
                items-end
                justify-end
            ">

                <img
                    src="./images/jg_white.webp"
                    class="
                        w-[175px]
                        h-auto
                    "
                >

            </div>

        </div>

    </main>

    <script>
        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });
        const phone = document.querySelector("#user-phone");
        async function signup() {
            const id = document.querySelector("#user-id").value;
            const password = document.querySelector("#user-password").value;
            const name = document.querySelector("#user-name").value;

            if (!valid_phone_number()) {
                phone.value = "";
                return;

            }

            try {
                const response = await fetch("/api/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id, password, name, phone: phone.value }),
                });
                const result = await response.json();

                if (!response.ok) {
                    alert(result.message);
                    return;
                }

                location.href = "./login.html";
            } catch (error) {
                alert("회원가입 요청에 실패했습니다.");
            }
        }

        function valid_phone_number() {

            if (!phone.checkValidity()) {
                phone.setCustomValidity("올바른 전화번호 형식을 입력해주세요");
                phone.reportValidity();
                return false;
            }

            phone.setCustomValidity("");
            return true;
        }
    </script>

</body>

</html>
