    <script>

        var weekNumOfMonth = function (date) {
            date = new Date(date);

            var WEEK_KOR = [
                "첫째주",
                "둘째주",
                "셋째주",
                "넷째주",
                "다섯째주"
            ];

            var THURSDAY_NUM = 4;

            var firstDate = new Date(
                date.getFullYear(),
                date.getMonth(),
                1
            );

            var firstDayOfWeek = firstDate.getDay();

            var firstThursday = 1 + THURSDAY_NUM - firstDayOfWeek;

            if (firstThursday <= 0) {
                firstThursday += 7;
            }

            var untilDateOfFirstWeek =
                firstThursday - 7 + 3;

            var weekNum =
                Math.ceil((date.getDate() - untilDateOfFirstWeek) / 7) - 1;

            if (weekNum < 0) {
                var lastDateOfMonth = new Date(
                    date.getFullYear(),
                    date.getMonth(),
                    0
                );

                return weekNumOfMonth(lastDateOfMonth);
            }

            return [
                WEEK_KOR[weekNum],
                (date.getMonth() + 1) + "월"
            ];
        };


        function getDateKey(date) {
            return (
                date.getFullYear() + "-" +
                String(date.getMonth() + 1).padStart(2, "0") + "-" +
                String(date.getDate()).padStart(2, "0")
            );
        }

        function getWeekKey(date) {
            const monday = new Date(date);

            monday.setDate(
                date.getDate() - (date.getDay() === 0 ? 6 : date.getDay() - 1)
            );

            return getDateKey(monday);
        }

        let thisWeek = 0;
        const weekKey = getWeekKey(new Date(getServerNow()));

        workoutRecords.forEach(record => {
            const date = new Date(record.date);

            if (getWeekKey(date) === weekKey) {
                thisWeek += record.time;
            }
        });

        console.log(thisWeek);

        const workoutProgress = document.getElementById("workout-progress");
        const workoutTimeText = document.getElementById("workout-time");

        const goalTime = 82 * 60 * 1000;

        const workoutTime = thisWeek;

        function getProgressBackground(time) {

            if (time <= goalTime) {

                const progress = time / goalTime * 100;

                return `
                    conic-gradient(
                        #05D082 0% ${progress}%,
                        rgba(255, 255, 255, 0.25) ${progress}% 100%
                    )
                `;
            }

            const progress = Math.min(
                (time - goalTime) / goalTime * 100,
                100
            );
            return `
                conic-gradient(
                    #FF4545 0% ${progress}%,
                    #05D082 ${progress}% 100%
                )
            `;
        }

        function getTimeText(time) {
            const totalSeconds = Math.floor(time / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = String(
                totalSeconds % 60
            ).padStart(2, "0");
            return `${minutes}:${seconds}`;
        }

        function animateProgress(time) {
            const firstLapTime = Math.min(time, goalTime);
            const secondLapTime = Math.max(
                Math.min(time - goalTime, goalTime),
                0
            );
            const firstDuration = 1000 * (firstLapTime / goalTime);
            const secondDuration = 1000 * (secondLapTime / goalTime);
            const startTime = performance.now();

            function animateFirstLap(now) {
                const progress = Math.min(
                    (now - startTime) / firstDuration,
                    1
                );
                const percent =
                    progress *
                    (firstLapTime / goalTime) *
                    100;
                workoutProgress.style.background = `
                    conic-gradient(
                        #05D082 0% ${percent}%,
                        rgba(255, 255, 255, 0.25) ${percent}% 100%
                    )
                `;
                if (progress < 1) {
                    requestAnimationFrame(animateFirstLap);
                    return;
                }
                if (time > goalTime) {
                    requestAnimationFrame(animateSecondLap);
                }
            }

            let secondStartTime;
            function animateSecondLap(now) {
                if (!secondStartTime) {
                    secondStartTime = now;
                }
                const progress = Math.min(
                    (now - secondStartTime) / secondDuration,
                    1
                );
                const percent =
                    progress *
                    (secondLapTime / goalTime) *
                    100;
                workoutProgress.style.background = `
                    conic-gradient(
                        #FF4545 0% ${percent}%,
                        #05D082 ${percent}% 100%
                    )
                `;

                if (progress < 1) {
                    requestAnimationFrame(animateSecondLap);
                }
            }
            requestAnimationFrame(animateFirstLap);
        }

        animateProgress(workoutTime);
        let temp = weekNumOfMonth(Date.now())
        document.getElementById("monthweek").textContent = temp[1] + " " + temp[0]

        workoutTimeText.textContent =
            getTimeText(workoutTime);

        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });
    </script>
