<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <link
        rel="preload"
        as="image"
        href="./images/bg.jpeg"
    >

    <script src="./js/store.js"></script>

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #000;
            font-family: "Pretendard Variable", sans-serif;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <main class="
        relative
        mx-auto
        h-[874px]
        w-[402px]
        overflow-hidden

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-linear-180
            from-[#000000]/80 from-30%
            to-[#000000]/65 to-100%
        "></div>

        <div class="
            absolute
            left-[env(safe-area-inset-left)]
            right-[env(safe-area-inset-right)]
            top-[env(safe-area-inset-top)]
            bottom-[env(safe-area-inset-bottom)]

            flex
            flex-col
        ">

            {% include "components/header.html" %}

            <section class="
                px-[30px]
                pt-[30px]
            ">

                <div class="
                    flex
                    items-start
                    gap-[20px]
                ">

                    <img
                        id="room-icon"
                        src="./images/sports_run.svg"
                        class="
                            mt-[4px]
                            h-[42px]
                            w-[42px]
                        "
                    >

                    <div class="
                        flex-1
                        flex
                        flex-col
                    ">

                        <div class="
                            flex
                            items-center
                            justify-between
                        ">
                            <span
                                id="room-date"
                                class="
                                    text-[20px]
                                    font-normal
                                "
                            >
                                로딩중..
                            </span>

                            <span
                                id="room-count"
                                class="
                                    text-[18px]
                                    font-thin
                                "
                            >
                                0/0
                            </span>
                        </div>

                        <span
                            id="room-time"
                            class="
                                -mt-[5px]

                                text-[20px]
                                font-bold
                                whitespace-nowrap
                            "
                        >
                            --:-- ~ --:--
                        </span>

                        <span
                            id="room-name"
                            class="
                                mt-[4px]

                                text-[20px]
                                font-normal
                            "
                        >
                            방 이름
                        </span>

                    </div>

                </div>

            </section>
            <div
                id="participant-list"
                class="
                    mt-[48px]
                    px-[20px]

                    flex
                    flex-col
                    gap-[10px]
                "
            ></div>

            <div class="
                mt-auto

                px-[20px]
                pb-[12px]

                flex
                flex-col
                gap-[12px]
            ">

                <button
                    id="primary-action"
                    class="
                        h-[48px]
                        w-full
                        rounded-[20px]

                        bg-[#05D082]
                        text-white

                        text-[20px]
                        leading-none
                        font-extrabold
                    "
                >
                    준비하기
                </button>

                <button
                    id="secondary-action"
                    class="
                        h-[48px]
                        w-full
                        rounded-[20px]
                        
                        bg-[#DC4778]
                        text-white

                        text-[20px]
                        leading-none
                        font-extrabold
                    "
                >
                    나가기
                </button>

            </div>

        </div>

    </main>

    <script>

        const sportIcons = {
            "농구": "sports_basketball.svg",
            "헬스": "sports_gym.svg",
            "런닝": "sports_run.svg",
            "축구": "sports_soccer.svg",
            "스트레칭": "sports_stretching.svg",
        };

        const participantList = document.getElementById("participant-list");
        const primaryAction = document.getElementById("primary-action");
        const secondaryAction = document.getElementById("secondary-action");

        function goToMain() {
            location.href = "./main.html";
        }

        async function startRoom(roomId) {
            const response = await fetch(
                `/api/rooms/${encodeURIComponent(roomId)}/workout`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        userId: localStorage.getItem("userId"),
                        type: "start",
                    }),
                }
            );
            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "운동 시작에 실패했습니다.");
            }

            location.href = `./sample_start.html?roomId=${encodeURIComponent(roomId)}`;
        }

        async function leaveRoom(roomId) {
            const response = await fetch(
                `/api/rooms/${encodeURIComponent(roomId)}/leave`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: localStorage.getItem("userId") }),
                }
            );
            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "방 나가기에 실패했습니다.");
            }

            goToMain();
        }

        async function deleteRoom(roomId) {
            const response = await fetch(
                `/api/rooms/${encodeURIComponent(roomId)}`,
                {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: localStorage.getItem("userId") }),
                }
            );
            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "방 삭제에 실패했습니다.");
            }

            goToMain();
        }

        async function loadRoom() {
            const roomId = new URLSearchParams(location.search).get("roomId");

            if (!roomId) {
                document.getElementById("room-name").textContent = "방을 찾을 수 없습니다.";
                document.getElementById("room-time").textContent = "방 ID가 없습니다.";
                return;
            }

            try {
                const response = await fetch(`/api/rooms/${encodeURIComponent(roomId)}`);
                const result = await response.json();

                if (!response.ok || !result.room) {
                    throw new Error("방 정보를 불러오지 못했습니다.");
                }

                const roomData = result.room;
                const [date, ...timeParts] = roomData.time.split(" ");
                const time = timeParts.join(" ");

                document.getElementById("room-icon").src =
                    `./images/${sportIcons[roomData.type] || sportIcons["런닝"]}`;

                document.getElementById("room-date").textContent = date;
                document.getElementById("room-time").textContent = time;
                document.getElementById("room-name").textContent = roomData.name;
                document.getElementById("room-count").textContent =
                    `${roomData.members.length}/${roomData.max}`;
                const currentMember = roomData.members.find(
                    member => member.id === localStorage.getItem("userId")
                );
                const isHost = currentMember && currentMember.isHost;

                if (isHost) {
                    primaryAction.textContent = "시작하기";
                    secondaryAction.textContent = "방 삭제하기";
                    primaryAction.onclick = () => startRoom(roomId).catch(error => alert(error.message));
                    secondaryAction.onclick = () => {
                        if (confirm("방을 삭제하시겠습니까?")) {
                            deleteRoom(roomId).catch(error => alert(error.message));
                        }
                    };
                } else {
                    primaryAction.textContent = "준비하기";
                    secondaryAction.textContent = "나가기";
                    primaryAction.onclick = () => {
                        location.href = `./sample_start.html?roomId=${encodeURIComponent(roomId)}`;
                    };
                    secondaryAction.onclick = () => leaveRoom(roomId).catch(error => alert(error.message));
                }

                roomData.members.forEach(member => {
                    const participant = document.createElement("div");

                    const statusText = member.isHost
                        ? "방장"
                        : member.isReady
                            ? "준비완료"
                            : "준비중";

                    const statusColor = member.isHost
                        ? "text-[#ffffff]"
                        : member.isReady
                            ? "text-[#05D082]"
                            : "text-[#DC4778]";

                    participant.className = `
                h-[60px]
                rounded-[12px]

                bg-[#666666]/75

                px-[30px]

                flex
                items-center
                justify-between
            `;

                    participant.innerHTML = `
                <span class="
                    text-[24px]
                    leading-none
                    font-normal
                ">
                    ${member.name}
                </span>

                <span class="
                    text-[21px]
                    leading-none
                    font-bold
                    ${statusColor}
                ">
                    ${statusText}
                </span>
            `;

                    participantList.appendChild(participant);
                });
            } catch (error) {
                document.getElementById("room-name").textContent = "방을 불러오지 못했습니다.";
                document.getElementById("room-time").textContent = "잠시 후 다시 시도해주세요.";
            }
        }

        loadRoom();

        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });
    </script>

</body>

</html>
