<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
        crossorigin
    >

    <link
        rel="stylesheet"
        crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <link
        rel="preload"
        as="image"
        href="./images/bg.jpeg"
    >

    <link
        rel="preload"
        as="image"
        href="./images/jg_white.webp"
    >

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;

            font-family: "Pretendard Variable", sans-serif;
            background: #000;
        }
    </style>
</head>

<body>

    <main class="
        relative
        h-dvh
        w-full
        overflow-hidden

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-linear-180
            from-[#000000]/90 from-30%
            via-[#000000]/80 via-50%
            to-[#000000]/70 to-95%
        "></div>

        <div class="
            absolute
            left-[env(safe-area-inset-left)]
            right-[env(safe-area-inset-right)]
            top-[env(safe-area-inset-top)]
            bottom-[env(safe-area-inset-bottom)]

            flex
            flex-col
        ">

            <div class="
                pt-[30px]
                px-[30px]

                flex
                items-start
                justify-between
            ">

                <div class="
                    text-[32px]
                    leading-[1.2]
                    font-black
                ">
                    PROJECT<br>
                    482
                </div>

                <div class="
                    text-right
                    text-[24px]
                    leading-[1.2]
                    font-bold
                    tracking-[0.015em]
                ">
                    <div>일주일에</div>
                    <div><span class="font-black">4 </span>번</div>
                    <div><span class="font-black">82 </span>분</div>
                    <div>운동하기</div>
                </div>

            </div>

            <div class="
                flex-1

                flex
                items-center
                justify-center
            ">

                <div class="
                    w-[240px]

                    flex
                    flex-col
                    gap-[24px]
                ">

                    <button
                        type="button"
                        onclick="location.href='./login'"
                        class="
                            h-[48px]
                            w-full
                            rounded-[20px]

                            bg-white
                            text-black

                            text-[18px]
                            leading-none
                            font-extrabold
                        "
                    >
                        Log in
                    </button>

                    <button
                        type="button"
                        onclick="location.href='./signup'"
                        class="
                            h-[48px]
                            w-full
                            rounded-[20px]

                            bg-[#05D082]
                            text-white

                            text-[18px]
                            leading-none
                            font-extrabold
                        "
                    >
                        Sign up
                    </button>

                </div>

            </div>

            <div class="
                px-[20px]
                pb-[20px]

                flex
                justify-end
            ">

                <img
                    src="./images/jg_white.webp"
                    class="
                        w-[175px]
                        h-auto
                    "
                >

            </div>

        </div>

    </main>

    <script>
        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });
    </script>

</body>

</html>
