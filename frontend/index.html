<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
        crossorigin
    >
    <link
        rel="stylesheet"
        crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <link
        rel="preload"
        as="image"
        href="./images/bg.jpeg"
    >
    <link
        rel="preload"
        as="image"
        href="./images/jg_white.webp"
    >
    <link
        rel="preload"
        as="image"
        href="./images/jg_green.webp"
    >

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: "Pretendard Variable", sans-serif;
            background: #000;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <main class="
            relative
            h-dvh
            w-full
            overflow-hidden
            bg-[url('./images/bg.jpeg')]
            bg-cover
            bg-center
            text-white
        ">

        <div class="
                absolute inset-0
                bg-linear-180
                from-[#000000]/90 from-30%
                via-[#000000]/80 via-50%
                to-[#000000]/70 to-95%
            "></div>
        <div class="
            absolute
            left-[env(safe-area-inset-left)]
            right-[env(safe-area-inset-right)]
            top-[env(safe-area-inset-top)]
            bottom-[env(safe-area-inset-bottom)]
        ">


            <div class="
                absolute
                top-[30px]
                left-[30px]

                m-0
                text-[32px]
                leading-[1.2]
                font-black
                whitespace-nowrap
            ">
                PROJECT<br>
                482
            </div>

            <div class="
                absolute
                top-[30px]
                right-[30px]

                text-right
                text-[24px]
                leading-[1.2]
                font-bold
                tracking-[0.015em]
                whitespace-nowrap
            ">
                <div>일주일에</div>
                <div><span class="font-black ">4 </span>번</div>
                <div><span class="font-black">82 </span>분</div>
                <div>운동하기</div>
            </div>

            <div class="
                absolute
                top-1/2
                left-1/2
                -translate-x-1/2
                -translate-y-1/2
                w-[240px]

                flex
                flex-col
                gap-[24px]
            ">

                <button
                    type="button"
                    onclick="location.href='./login.html'"
                    class="
                    h-[48px]
                    w-full
                    rounded-[20px]

                    bg-white
                    text-black

                    text-[18px]
                    leading-none
                    font-extrabold

                    cursor-pointer
                    transition-transform
                    active:scale-[0.98]
                "
                >
                    Log in
                </button>


                <button
                    type="button"
                    class="
                    h-[48px]
                    w-full
                    rounded-[20px]

                    bg-[#05D082]
                    text-white

                    text-[18px]
                    leading-none
                    font-extrabold

                    cursor-pointer
                    transition-transform
                    active:scale-[0.98]
                "
                >
                    Sign up
                </button>

            </div>

            <img
                src="./images/jg_white.webp"
                alt=""
                class="
                absolute
                right-[20px]
                bottom-[20px]
                w-[175px]
                h-auto
            "
            >
        </div>
    </main>
    <script>
        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });
    </script>
</body>

</html>
