<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <link
        rel="preload"
        as="image"
        href="./images/bg.jpeg"
    >
    <script
        src="./components/header.js"
        defer
    ></script>

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #000;
            font-family: "Pretendard Variable", sans-serif;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <main class="
        relative
        mx-auto
        h-[874px]
        w-[402px]
        overflow-hidden

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-linear-180
            from-[#000000]/80 from-30%
            to-[#000000]/65 to-100%
        "></div>

        <div class="
            absolute
            left-[env(safe-area-inset-left)]
            right-[env(safe-area-inset-right)]
            top-[env(safe-area-inset-top)]
            bottom-[env(safe-area-inset-bottom)]

            flex
            flex-col
        ">

            <div id="header-area"></div>

            <section class="
                px-[30px]
                pt-[30px]
            ">

                <div
                    id="room-name"
                    class="
                        text-[30px]
                        leading-none
                        font-bold
                    "
                >
                    방 정보를 불러오지 못했습니다.
                </div>

                <div
                    id="room-time"
                    class="
                        mt-[34px]

                        text-[27px]
                        leading-none
                        font-normal
                        whitespace-nowrap
                    "
                >
                    시간을 불러오지 못했습니다.
                </div>

            </section>

            <div
                id="participant-list"
                class="
                    mt-[48px]
                    px-[20px]

                    flex
                    flex-col
                    gap-[10px]
                "
            ></div>

            <div class="
                mt-auto

                px-[20px]
                pb-[30px]

                flex
                items-center
                justify-center
                gap-[44px]
            ">

                <button
                    id="play-action"
                    class="
                        h-[120px]
                        w-[120px]
                        rounded-[20px]

                        bg-[#05D082]

                        flex
                        items-center
                        justify-center
                    ">
                    <img
                        src="./images/play.svg"
                        class="
                            h-[42px]
                            w-[42px]
                        "
                    >
                </button>

                <button
                    id="stop-action"
                    class="
                        h-[120px]
                        w-[120px]
                        rounded-[20px]

                        bg-[#F72D7D]

                        flex
                        items-center
                        justify-center
                    "
                >
                    <img
                        src="./images/stop.svg"
                        class="
                            h-[42px]
                            w-[42px]
                        "
                    >
                </button>

            </div>

        </div>

    </main>

    <script>
        const roomId = new URLSearchParams(location.search).get("roomId");
        const userId = localStorage.getItem("userId");
        const participantList = document.getElementById("participant-list");
        let roomData = null;
        let tickTimer = null;

        function getNow() {
            return Date.now();
        }

        function getWorkoutMilliseconds(logs) {
            let total = 0;
            let startedAt = null;

            logs.forEach(log => {
                const timestamp = new Date(log.timestamp).getTime();

                if (log.type === "start") {
                    startedAt = timestamp;
                }

                if (["pause", "stop"].includes(log.type) && startedAt !== null) {
                    total += timestamp - startedAt;
                    startedAt = null;
                }
            });

            if (startedAt !== null) {
                total += getNow() - startedAt;
            }

            return total;
        }

        function formatTime(milliseconds) {
            const seconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(seconds / 60);
            return `${minutes}:${String(seconds % 60).padStart(2, "0")}`;
        }

        function renderParticipants() {
            participantList.replaceChildren();

            roomData.members.forEach((member, index) => {
                const participant = document.createElement("div");
                const logs = member.logs || [];
                const lastLog = logs[logs.length - 1];
                const isWorking = lastLog?.type === "start";
                const statusText = isWorking ? "운동중" : "휴식중";
                const statusColor = isWorking
                    ? "text-[#05D082]"
                    : "text-[#F72D7D]";

                participant.className = `
                    h-[60px]
                    rounded-[12px]
                    bg-[#666666]/75
                    px-[30px]
                    grid
                    grid-cols-3
                    items-center
                `;

                participant.innerHTML = `
                    <span class="text-[24px] leading-none font-normal">
                        ${member.name}
                    </span>
                    <span id="participant-time-${index}" class="text-center text-[24px] leading-none font-bold">
                        ${formatTime(getWorkoutMilliseconds(logs))}
                    </span>
                    <span class="text-right text-[21px] leading-none font-bold ${statusColor}">
                        ${statusText}
                    </span>
                `;

                participantList.appendChild(participant);
            });
        }

        function updateParticipantTimes() {
            roomData.members.forEach((member, index) => {
                const logs = member.logs || [];
                if (logs[logs.length - 1]?.type !== "start") return;

                document.getElementById(`participant-time-${index}`).textContent =
                    formatTime(getWorkoutMilliseconds(logs));
            });
        }

        function scheduleNextTick() {
            clearTimeout(tickTimer);
            if (!roomData.members.some(member =>
                (member.logs || []).at(-1)?.type === "start"
            )) return;

            tickTimer = setTimeout(() => {
                updateParticipantTimes();
                scheduleNextTick();
            }, 1000);
        }

        async function sendWorkout(type) {
            const response = await fetch(`/api/rooms/${encodeURIComponent(roomId)}/workout`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId, type }),
            });
            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "운동 상태 변경에 실패했습니다.");
            }

            roomData = result.room;
            renderParticipants();
            scheduleNextTick();
        }

        async function loadRoom() {
            if (!roomId) throw new Error("방 ID가 없습니다.");

            const response = await fetch(`/api/rooms/${encodeURIComponent(roomId)}`);
            const result = await response.json();

            if (!response.ok || !result.room) {
                throw new Error("방 정보를 불러오지 못했습니다.");
            }

            roomData = result.room;
            document.getElementById("room-name").textContent = roomData.name;
            document.getElementById("room-time").textContent = roomData.time;
            renderParticipants();
            scheduleNextTick();
        }

        document.getElementById("play-action").onclick = () =>
            sendWorkout("start").catch(error => alert(error.message));

        document.getElementById("stop-action").onclick = async () => {
            try {
                await sendWorkout("stop");
                location.href = "./complete";
            } catch (error) {
                alert(error.message);
            }
        };

        loadRoom().catch(error => {
            document.getElementById("room-name").textContent = "방을 불러오지 못했습니다.";
            document.getElementById("room-time").textContent = error.message;
        });

        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });
    </script>

</body>

</html>
