<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <script src="./js/store.js"></script>
    <script
        src="./components/header.js"
        defer
    ></script>

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        body {
            margin: 0;
            background: #000;
            font-family: "Pretendard Variable", sans-serif;
        }
    </style>
</head>

<body>

    <main class="
        relative
        h-dvh

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-black/65
        "></div>

        <div class="
            absolute
            top-[env(safe-area-inset-top)]
            right-[env(safe-area-inset-right)]
            bottom-[env(safe-area-inset-bottom)]
            left-[env(safe-area-inset-left)]

            flex
            flex-col
        ">

            <div id="header-area"></div>

            <div class="
                mt-[24px]
                pl-[24px]
                pr-[24px]

                grid
                grid-cols-[60px_minmax(0,1fr)]
                items-center
                gap-x-[9px]
                gap-y-[12px]
            ">

                <label
                    for="room-name"
                    class="
                        text-[18px]
                        font-normal
                    "
                >
                    방 이름
                </label>

                <input
                    id="room-name"
                    type="text"
                    class="
                        h-[48px]

                        rounded-full
                        bg-white
                        px-[18px]

                        text-[18px]
                        text-black
                    "
                >

                <label
                    for="room-date"
                    class="
                        text-[18px]
                        font-normal
                    "
                >
                    날짜
                </label>

                <input
                    id="room-date"
                    type="text"
                    class="
                        h-[48px]

                        rounded-full
                        bg-white
                        px-[18px]

                        text-[18px]
                        text-black
                    "
                >

                <label
                    for="room-time"
                    class="
                        text-[18px]
                        font-normal
                    "
                >
                    시간
                </label>

                <input
                    id="room-time"
                    type="text"
                    class="
                        h-[48px]

                        rounded-full
                        bg-white
                        px-[18px]

                        text-[18px]
                        text-black
                    "
                >

            </div>

            <button
                onclick="createRoom()"
                class="
                    absolute
                    bottom-[10px]
                    right-[10px]
                    left-[10px]

                    h-[48px]
                    rounded-[20px]

                    bg-[#05D082]
                    text-white

                    text-[18px]
                    leading-none
                    font-extrabold
                "
            >
                방 만들기
            </button>

        </div>

    </main>


    <script>
        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });

        async function createRoom() {
            const hostId = localStorage.getItem("userId");
            const roomName = document.querySelector("#room-name").value.trim();
            const date = document.querySelector("#room-date").value.trim();
            const time = document.querySelector("#room-time").value.trim();

            if (!hostId) {
                alert("로그인 후 방을 만들 수 있습니다.");
                location.href = "./login.html";
                return;
            }

            if (!roomName || !date || !time) {
                alert("방 이름, 날짜, 시간을 모두 입력해주세요.");
                return;
            }

            try {
                const response = await fetch("/api/rooms", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        roomName,
                        time: `${date} ${time}`,
                        hostId,
                    }),
                });
                const result = await response.json();

                if (!response.ok) {
                    alert(result.message || "방 생성에 실패했습니다.");
                    return;
                }

                location.href = "./main.html";
            } catch (error) {
                alert("방 생성 요청에 실패했습니다.");
            }
        }
    </script>

</body>

</html>
