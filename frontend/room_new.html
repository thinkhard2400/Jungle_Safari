<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <script src="./js/store.js"></script>

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        body {
            margin: 0;
            background: #000;
            font-family: "Pretendard Variable", sans-serif;
        }
    </style>
</head>

<body>

    <main class="
        relative
        mx-auto
        h-dvh
        w-full

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-black/65
        "></div>

        <div class="
            absolute
            top-[env(safe-area-inset-top)]
            right-[env(safe-area-inset-right)]
            bottom-[env(safe-area-inset-bottom)]
            left-[env(safe-area-inset-left)]

            flex
            flex-col
        ">

            {% include "components/header.html" %}

            <div class="
                mx-[16px]
                mt-[24px]
                rounded-[24px]
                border
                border-white/20
                bg-black/75
                px-[20px]
                py-[8px]
            ">

                <label class="block py-[14px] text-[18px] font-normal">
                    <span class="block mb-[8px]">방 이름</span>
                    <input
                        id="room-name"
                        type="text"
                        placeholder="방 이름을 입력해주세요"
                        class="
                            h-[44px]
                            w-full
                            rounded-full
                            bg-white
                            px-[18px]
                            text-[16px]
                            text-black
                        "
                    >
                </label>

                <div class="border-t border-white/15 py-[14px]">
                    <span class="block mb-[12px] text-[18px]">운동 선택</span>
                    <div class="grid grid-cols-5 gap-[6px]">
                        <button
                            type="button"
                            data-sport="농구"
                            class="sport-option rounded-[12px] p-[6px] text-[11px]"
                        >
                            <img
                                src="./images/sports_basketball.svg"
                                alt="농구"
                                class="mx-auto h-[30px]"
                            >
                            <span>농구</span>
                        </button>
                        <button
                            type="button"
                            data-sport="헬스"
                            class="sport-option rounded-[12px] p-[6px] text-[11px]"
                        >
                            <img
                                src="./images/sports_gym.svg"
                                alt="헬스"
                                class="mx-auto h-[30px]"
                            >
                            <span>헬스</span>
                        </button>
                        <button
                            type="button"
                            data-sport="런닝"
                            class="sport-option rounded-[12px] p-[6px] text-[11px] ring-2 ring-[#05D082] bg-[#05D082]/20"
                        >
                            <img
                                src="./images/sports_run.svg"
                                alt="런닝"
                                class="mx-auto h-[30px]"
                            >
                            <span>런닝</span>
                        </button>
                        <button
                            type="button"
                            data-sport="축구"
                            class="sport-option rounded-[12px] p-[6px] text-[11px]"
                        >
                            <img
                                src="./images/sports_soccer.svg"
                                alt="축구"
                                class="mx-auto h-[30px]"
                            >
                            <span>축구</span>
                        </button>
                        <button
                            type="button"
                            data-sport="스트레칭"
                            class="sport-option rounded-[12px] p-[6px] text-[11px]"
                        >
                            <img
                                src="./images/sports_stretching.svg"
                                alt="스트레칭"
                                class="mx-auto h-[30px]"
                            >
                            <span>스트레칭</span>
                        </button>
                    </div>
                </div>

                <div class="border-t border-white/15 py-[14px]">
                    <span class="
                            block
                            mb-[10px]

                            text-[18px]
                            font-normal
                        ">
                        날짜
                    </span>

                    <input
                        id="room-date"
                        type="date"
                        class="
                            h-[44px]
                            w-full
                            rounded-full

                            bg-white
                            px-[18px]

                            text-[16px]
                            text-black
                        "
                    >
                </div>
                <div class="border-t border-white/15 py-[14px]">
                    <span class="
                            block
                            mb-[10px]

                            text-[18px]
                            font-normal
                        ">
                        시간
                    </span>

                    <div class="
                            flex
                            items-center
                            gap-[8px]
                        ">
                        <select
                            id="room-time-start"
                            class="
                                h-[44px]
                                min-w-0
                                flex-1
                                rounded-full

                                bg-white
                                px-[12px]

                                text-[16px]
                                text-black
                            "
                        >
                            <option value="">시작 시간</option>
                        </select>

                        <span class="text-[18px]">~</span>

                        <select
                            id="room-time-end"
                            class="
                                    h-[44px]
                                    min-w-0
                                    flex-1
                                    rounded-full

                                    bg-white
                                    px-[12px]

                                    text-[16px]
                                    text-black
                                "
                        >
                            <option value="">종료 시간</option>
                        </select>
                    </div>
                </div>

                <div class="border-t border-white/15 py-[14px]">
                    <label
                        for="room-max-members"
                        class="flex items-center justify-between text-[18px]"
                    >
                        <span>최대 인원</span>
                        <select
                            id="room-max-members"
                            class="rounded-full bg-white px-[14px] py-[8px] text-[16px] text-black"
                        >
                            <option value="2">2명</option>
                            <option value="3">3명</option>
                            <option
                                value="4"
                                selected
                            >4명</option>
                        </select>
                    </label>
                </div>
            </div>
        </div>

        <button
            onclick="createRoom()"
            class="
                    absolute
                    bottom-[10px]
                    right-[10px]
                    left-[10px]

                    h-[48px]
                    rounded-[20px]

                    bg-[#05D082]
                    text-white

                    text-[18px]
                    leading-none
                    font-extrabold
                "
        >
            방 만들기
        </button>

        </div>

    </main>


    <script>
        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });

        function addTimeOptions(selectId) {
            const select = document.querySelector(selectId);

            for (let minutes = 0; minutes < 24 * 60; minutes += 10) {
                const hour = String(Math.floor(minutes / 60)).padStart(2, "0");
                const minute = String(minutes % 60).padStart(2, "0");
                const option = document.createElement("option");
                option.value = `${hour}:${minute}`;
                option.textContent = `${hour}:${minute}`;
                select.appendChild(option);
            }
        }

        addTimeOptions("#room-time-start");
        addTimeOptions("#room-time-end");

        function setDefaultRoomValues() {
            document.querySelector("#room-name").value = "런닝 할 사람!!";

            const today = new Date();
            const date = [
                today.getFullYear(),
                String(today.getMonth() + 1).padStart(2, "0"),
                String(today.getDate()).padStart(2, "0"),
            ].join("-");
            document.querySelector("#room-date").value = date;

            const roundedMinutes = Math.ceil(
                (today.getHours() * 60 + today.getMinutes()) / 10
            ) * 10;
            const startMinutes = Math.min(roundedMinutes, 23 * 60 + 30);
            const endMinutes = startMinutes + 20;

            const toTime = (minutes) => {
                const hour = String(Math.floor(minutes / 60)).padStart(2, "0");
                const minute = String(minutes % 60).padStart(2, "0");
                return `${hour}:${minute}`;
            };

            document.querySelector("#room-time-start").value = toTime(startMinutes);
            document.querySelector("#room-time-end").value = toTime(endMinutes);
        }

        setDefaultRoomValues();

        let selectedSport = "런닝";

        document.querySelectorAll(".sport-option").forEach((option) => {
            option.addEventListener("click", () => {
                document.querySelectorAll(".sport-option").forEach((item) => {
                    item.classList.remove("ring-2", "ring-[#05D082]", "bg-[#05D082]/20");
                });

                option.classList.add("ring-2", "ring-[#05D082]", "bg-[#05D082]/20");
                selectedSport = option.dataset.sport;
            });
        });

        async function createRoom() {
            const hostId = localStorage.getItem("userId");
            const roomName = document.querySelector("#room-name").value.trim();
            const date = document.querySelector("#room-date").value.trim();
            const startTime = document.querySelector("#room-time-start").value;
            const endTime = document.querySelector("#room-time-end").value;
            const maxMembers = Number(document.querySelector("#room-max-members").value);

            if (!hostId) {
                alert("로그인 후 방을 만들 수 있습니다.");
                location.href = "./login";
                return;
            }

            if (!roomName || !date || !startTime || !endTime) {
                alert("방 이름, 날짜, 시간을 모두 입력해주세요.");
                return;
            }

            if (startTime >= endTime) {
                alert("종료 시간은 시작 시간보다 늦어야 합니다.");
                return;
            }

            try {
                const response = await fetch("/api/rooms", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        roomName,
                        type: selectedSport,
                        time: `${date} ${startTime} ~ ${endTime}`,
                        maxMembers,
                        hostId,
                    }),
                });
                const result = await response.json();

                if (!response.ok) {
                    alert(result.message || "방 생성에 실패했습니다.");
                    return;
                }

                location.href = `./room?roomId=${encodeURIComponent(result.room.id)}`;
            } catch (error) {
                alert("방 생성 요청에 실패했습니다.");
            }
        }
    </script>

</body>

</html>
