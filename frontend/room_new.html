<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <script src="./js/store.js"></script>
    <script
        src="./components/header.js"
        defer
    ></script>

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        body {
            margin: 0;
            background: #000;
            font-family: "Pretendard Variable", sans-serif;
        }
    </style>
</head>

<body>

    <main class="
        relative
        h-dvh

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-black/65
        "></div>

        <div class="
            absolute
            top-[env(safe-area-inset-top)]
            right-[env(safe-area-inset-right)]
            bottom-[env(safe-area-inset-bottom)]
            left-[env(safe-area-inset-left)]

            flex
            flex-col
        ">

            <div id="header-area"></div>

            <div class="
                mt-[24px]
                pl-[24px]
                pr-[45px]

                grid
                grid-cols-[60px_1fr]
                items-center
                gap-x-[9px]
                gap-y-[12px]
            ">

                <label
                    for="room-name"
                    class="
                        text-[18px]
                        font-normal
                    "
                >
                    방 이름
                </label>

                <input
                    id="room-name"
                    type="text"
                    class="
                        h-[48px]

                        rounded-full
                        bg-white
                        px-[18px]

                        text-[18px]
                        text-black
                    "
                >

                <label
                    for="room-date"
                    class="
                        text-[18px]
                        font-normal
                    "
                >
                    날짜
                </label>

                <input
                    id="room-date"
                    type="text"
                    class="
                        h-[48px]

                        rounded-full
                        bg-white
                        px-[18px]

                        text-[18px]
                        text-black
                    "
                >

                <label
                    for="room-time"
                    class="
                        text-[18px]
                        font-normal
                    "
                >
                    시간
                </label>

                <input
                    id="room-time"
                    type="text"
                    class="
                        h-[48px]

                        rounded-full
                        bg-white
                        px-[18px]

                        text-[18px]
                        text-black
                    "
                >

            </div>

            <button
                onclick="location.href='./room_new.html'"
                class="
                    absolute
                    bottom-[10px]
                    right-[10px]
                    left-[10px]

                    h-[48px]
                    rounded-[20px]

                    bg-[#05D082]
                    text-white

                    text-[18px]
                    leading-none
                    font-extrabold
                "
            >
                방 만들기
            </button>

        </div>

    </main>


    <script>
        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });
    </script>

</body>

</html>
