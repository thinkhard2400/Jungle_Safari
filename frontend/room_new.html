<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >

    <script src="./js/store.js"></script>
    <script
        src="./components/header.js"
        defer
    ></script>

    <title>Project 482</title>

    <style>
        html {
            visibility: hidden;
        }

        html.fonts-loaded {
            visibility: visible;
        }

        body {
            margin: 0;
            background: #000;
            font-family: "Pretendard Variable", sans-serif;
        }
    </style>
</head>

<body>

    <main class="
        relative
        h-dvh

        bg-[url('./images/bg.jpeg')]
        bg-cover
        bg-center

        text-white
    ">

        <div class="
            absolute
            inset-0

            bg-black/65
        "></div>

        <div class="
            absolute
            top-[env(safe-area-inset-top)]
            right-[env(safe-area-inset-right)]
            bottom-[env(safe-area-inset-bottom)]
            left-[env(safe-area-inset-left)]

            flex
            flex-col
        ">

            <div id="header-area"></div>

            <div class="
                mx-[16px]
                mt-[24px]
                rounded-[24px]
                border
                border-white/20
                bg-black/75
                px-[20px]
                py-[8px]
            ">

                <label class="block py-[14px] text-[18px] font-normal">
                    <span class="block mb-[8px]">방 이름</span>
                    <input
                        id="room-name"
                        type="text"
                        placeholder="방 이름을 입력해주세요"
                        class="
                            h-[44px]
                            w-full
                            rounded-full
                            bg-white
                            px-[18px]
                            text-[16px]
                            text-black
                        "
                    >
                </label>

                <div class="border-t border-white/15 py-[14px]">
                    <button
                        id="date-toggle"
                        type="button"
                        class="flex w-full items-center justify-between text-left text-[18px]"
                    >
                        <span>날짜</span>
                        <span class="text-[#05D082]">⌄</span>
                    </button>
                    <div id="date-panel" class="hidden pt-[12px]">
                        <input
                            id="room-date"
                            type="date"
                            class="h-[44px] w-full rounded-full bg-white px-[18px] text-[16px] text-black"
                        >
                    </div>
                </div>

                <div class="border-t border-white/15 py-[14px]">
                    <button
                        id="time-toggle"
                        type="button"
                        class="flex w-full items-center justify-between text-left text-[18px]"
                    >
                        <span>시간</span>
                        <span class="text-[#05D082]">⌄</span>
                    </button>
                    <div id="time-panel" class="hidden pt-[12px]">
                        <div class="flex items-center gap-[8px]">
                            <select
                                id="room-time-start"
                                class="h-[44px] min-w-0 flex-1 rounded-full bg-white px-[12px] text-[16px] text-black"
                            >
                                <option value="">시작 시간</option>
                            </select>
                            <span>~</span>
                            <select
                                id="room-time-end"
                                class="h-[44px] min-w-0 flex-1 rounded-full bg-white px-[12px] text-[16px] text-black"
                            >
                                <option value="">종료 시간</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <button
                onclick="createRoom()"
                class="
                    absolute
                    bottom-[10px]
                    right-[10px]
                    left-[10px]

                    h-[48px]
                    rounded-[20px]

                    bg-[#05D082]
                    text-white

                    text-[18px]
                    leading-none
                    font-extrabold
                "
            >
                방 만들기
            </button>

        </div>

    </main>


    <script>
        document.fonts.ready.then(() => {
            document.documentElement.classList.add("fonts-loaded");
        });

        document.querySelector("#date-toggle").addEventListener("click", () => {
            document.querySelector("#date-panel").classList.toggle("hidden");
        });

        document.querySelector("#time-toggle").addEventListener("click", () => {
            document.querySelector("#time-panel").classList.toggle("hidden");
        });

        function addTimeOptions(selectId) {
            const select = document.querySelector(selectId);

            for (let minutes = 0; minutes < 24 * 60; minutes += 10) {
                const hour = String(Math.floor(minutes / 60)).padStart(2, "0");
                const minute = String(minutes % 60).padStart(2, "0");
                const option = document.createElement("option");
                option.value = `${hour}:${minute}`;
                option.textContent = `${hour}:${minute}`;
                select.appendChild(option);
            }
        }

        addTimeOptions("#room-time-start");
        addTimeOptions("#room-time-end");

        async function createRoom() {
            const hostId = localStorage.getItem("userId");
            const roomName = document.querySelector("#room-name").value.trim();
            const date = document.querySelector("#room-date").value.trim();
            const startTime = document.querySelector("#room-time-start").value;
            const endTime = document.querySelector("#room-time-end").value;

            if (!hostId) {
                alert("로그인 후 방을 만들 수 있습니다.");
                location.href = "./login.html";
                return;
            }

            if (!roomName || !date || !startTime || !endTime) {
                alert("방 이름, 날짜, 시간을 모두 입력해주세요.");
                return;
            }

            if (startTime >= endTime) {
                alert("종료 시간은 시작 시간보다 늦어야 합니다.");
                return;
            }

            try {
                const response = await fetch("/api/rooms", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        roomName,
                        time: `${date} ${startTime} ~ ${endTime}`,
                        hostId,
                    }),
                });
                const result = await response.json();

                if (!response.ok) {
                    alert(result.message || "방 생성에 실패했습니다.");
                    return;
                }

                location.href = "./main.html";
            } catch (error) {
                alert("방 생성 요청에 실패했습니다.");
            }
        }
    </script>

</body>

</html>
