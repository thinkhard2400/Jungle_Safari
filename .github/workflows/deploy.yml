name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/Jungle_Safari
            git pull origin main
            source venv/bin/activate
            pip install -r backend/requirements.txt
            pkill -f "gunicorn.*backend" || true
            nohup gunicorn --chdir backend app:app --bind 0.0.0.0:5000 > gunicorn.log 2>&1 &
